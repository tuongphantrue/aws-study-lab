<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="330" viewBox="0 0 1320 330" role="img" aria-labelledby="title desc"><title id="title">Lambda concurrency</title><desc id="desc">Incoming events create concurrent executions until the account or function limit is reached.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#84939a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfb"/><text x="45" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#26363e">Lambda concurrency</text><text x="45" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#687980">Incoming events create concurrent executions until the account or function limit is reached.</text><rect x="45.0" y="145" rx="7" width="225.2" height="92" fill="#ffffff" stroke="#cfd8db" stroke-width="2"/><text x="157.6" y="196.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Events / API</text><line x1="276.2" y1="191.0" x2="289.2" y2="191.0" stroke="#84939a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="296.2" y="145" rx="7" width="225.2" height="92" fill="#f1f5f5" stroke="#cfd8db" stroke-width="2"/><text x="408.8" y="196.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Lambda service</text><line x1="527.4" y1="191.0" x2="540.4" y2="191.0" stroke="#84939a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="547.4" y="145" rx="7" width="225.2" height="92" fill="#ffffff" stroke="#cfd8db" stroke-width="2"/><text x="660.0" y="172.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Execution 1</text><text x="660.0" y="196.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Execution 2</text><text x="660.0" y="220.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Execution 3</text><line x1="778.6" y1="191.0" x2="791.6" y2="191.0" stroke="#84939a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="798.6" y="145" rx="7" width="225.2" height="92" fill="#f1f5f5" stroke="#cfd8db" stroke-width="2"/><text x="911.2" y="196.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Concurrency limit</text><line x1="1029.8" y1="191.0" x2="1042.8" y2="191.0" stroke="#84939a" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1049.8" y="145" rx="7" width="225.2" height="92" fill="#ffffff" stroke="#cfd8db" stroke-width="2"/><text x="1162.4" y="196.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#34464e">Throttle or process</text><text x="45" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#86949a">Study figure — simplified architecture model</text></svg>